[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jetlink"
version = "0.2.0"
description = "Run openpilot's large driving models on an attached NVIDIA Jetson"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Zeph Leggett" }]
requires-python = ">=3.10"
# numpy only. The client additionally needs `usb1` for the USB transport; the
# server needs one inference runtime, chosen by the extras below.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
usb = ["libusb1>=3.0"]
# The Jetson image: TensorRT and CUDA come with JetPack, so only their neighbours.
server = ["onnx>=1.16", "cuda-python>=12.6,<13"]
# A desktop or laptop NVIDIA GPU: TensorRT from PyPI, 11.x at the time of writing.
trt = ["onnx>=1.16", "tensorrt-cu12>=10.3", "cuda-python>=12.6,<13"]
# Apple silicon (CoreML) and a fallback anywhere else (CUDA or CPU providers).
ort = ["onnx>=1.16", "onnxruntime>=1.22"]
# Metal, and any GPU tinygrad drives.
tinygrad = ["tinygrad>=0.11"]
# Telemetry from a desktop NVIDIA GPU.
nvml = ["nvidia-ml-py>=12"]
dev = ["pytest>=7", "ruff", "onnx>=1.16"]

[project.scripts]
jetlink-server = "jetlink.server.main:main"
jetlink-models = "jetlink.registry.cli:main"

[tool.setuptools.packages.find]
include = ["jetlink*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The fork's rule set (sunnypilot's pyproject.toml), so code moves between the
# two without reformatting, with two differences the fork does not allow:
# strings may be implicitly concatenated across lines, and E402 stays on so the
# `# noqa: E402` under every importorskip in tests/ means something.
[tool.ruff]
target-version = "py310"
line-length = 160
indent-width = 2
lint.select = [
  "E", "F", "W", "PIE", "C4", "ISC", "A", "B",
  "NPY",
  "UP",
  "ASYNC",
  "B904", "B905",
  "PLC0207",
  "TRY203", "TRY400", "TRY401",
  "RUF006", "RUF008", "RUF009", "RUF061", "RUF064", "RUF100", "RUF102", "RUF103", "RUF104",
  "PLE", "PLR1704",
]
lint.ignore = [
  "E741",
  "B027",
  # An OSError the server expects (EBUSY refusing a suspend, EROFS on
  # /sys/power) is logged with its errno; a traceback there is noise.
  "TRY400",
]

[tool.ruff.format]
quote-style = "preserve"
