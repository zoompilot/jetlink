# Build the container images on every change to them or to what goes inside,
# and on main publish them as the edge images install.sh pulls.
#
# Two images, three builds:
#
#   docker/Dockerfile          CUDA 13, for NVIDIA PCs (amd64) and Jetsons on
#                              JetPack 7.2 or newer (arm64): one tag, edge-cuda,
#                              for both, so `docker pull` picks the right one
#   docker/Dockerfile.jetpack6 Jetsons on JetPack 6 (arm64): edge-jetpack6
#
# Each architecture builds on a native runner, not QEMU (13 minutes for an image
# where nothing compiles), pushes by digest, and a last job joins the two
# digests under one tag: Docker's documented way to build a multi-platform
# image across runners.
#
# The release workflow pushes the versioned tags. It is the only other thing
# that pushes, and twice an image has broken in a way only a tag revealed; the
# builds here move that discovery off the release.
#
# Paths, not every push: the CUDA image pulls 4 GB of TensorRT.
name: Docker images

on:
  # main only: a branch with a pull request would otherwise build every image
  # twice, and tag pushes (which ignore path filters) would repeat release.yml
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'jetlink/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'docker/**'
      - 'jetlink/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/zoompilot/jetlink
  # main in this repository publishes; a fork's main or a branch only builds
  PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'zoompilot/jetlink' }}

jobs:
  cuda:
    name: CUDA image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Make room for the image
        run: |
          # TensorRT is 4 GB before the image is even loaded back.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: jetlink:cuda
          cache-from: type=gha,scope=cuda-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=cuda-${{ matrix.arch }}

      - name: Check TensorRT and the server in the image
        run: |
          # No GPU here, so the checks are that TensorRT loads, that none of
          # its libraries is missing from the image, and that the server's
          # imports are whole. libcuda.so.1 is excluded on purpose: it belongs
          # to the driver and the container runtime injects it at run time.
          #
          # amd64 is the one that matters most: `-base` is 2.3 GB smaller than
          # `-runtime` because TensorRT's wheels vendor the CUDA libraries they
          # need, and if that is ever wrong it shows here as an unresolved
          # library rather than on somebody's laptop. arm64 carries JetPack's
          # own TensorRT from the Jetson apt repository.
          docker run --rm --entrypoint bash jetlink:cuda -c '
            set -euo pipefail
            python -c "import tensorrt; print(\"TensorRT\", tensorrt.__version__)"
            if [ "$(dpkg --print-architecture)" = amd64 ]; then
              LIBS=$(python -c "import tensorrt_libs, os; print(os.path.dirname(tensorrt_libs.__file__))")/libnvinfer.so.*
            else
              LIBS="/usr/lib/aarch64-linux-gnu/libnvinfer.so.10 /usr/lib/aarch64-linux-gnu/libnvonnxparser.so.10"
            fi
            MISSING=$(ldd $LIBS | grep "not found" | grep -v "libcuda.so.1" || true)
            if [ -n "$MISSING" ]; then
              echo "unresolved libraries, so the image is too thin:"
              echo "$MISSING"
              exit 1
            fi
            echo "every TensorRT dependency resolves"
            # the container toolkit crashes reading these before the server starts
            if ls /usr/local/cuda*/compat*/libcuda.so* >/dev/null 2>&1; then
              echo "CUDA forward-compatibility libraries are back in the image"
              exit 1
            fi
            python -c "import jetlink, onnx, usb1; from jetlink.server.backends.trt import cudart"
            jetlink-server --help > /dev/null
            echo "the server imports and starts"
          '

      - name: Report the image size
        run: docker image ls jetlink:cuda --format '{{.Repository}}:{{.Tag}}  {{.Size}}'

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        if: env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=cuda-${{ matrix.arch }}
        # The layers are in the cache from the build above, so this is the
        # upload and nothing else.

      - name: Record the digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-cuda-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  cuda-edge:
    name: Publish edge-cuda
    needs: cuda
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'zoompilot/jetlink'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-cuda-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag both architectures as edge-cuda
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            -t "$IMAGE:edge-cuda" -t "$IMAGE:edge-cuda-$GITHUB_SHA" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:edge-cuda"

  jetpack6:
    name: JetPack 6 image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.jetpack6
          platforms: linux/arm64
          push: false
          load: true
          tags: jetlink:jetpack6
          cache-from: type=gha,scope=jetson
          cache-to: type=gha,mode=max,scope=jetson

      - name: Check the server starts
        run: |
          # --help rather than a run: there is no Jetson GPU here. It still
          # proves the interpreter, the package and its imports are intact.
          docker run --rm --entrypoint python3 jetlink:jetpack6 \
            -m jetlink.server.main --help > /dev/null
          echo "the JetPack 6 image runs"

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish edge-jetpack6
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.jetpack6
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:edge-jetpack6
            ${{ env.IMAGE }}:edge-jetpack6-${{ github.sha }}
          cache-from: type=gha,scope=jetson
